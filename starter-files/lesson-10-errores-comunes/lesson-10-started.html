<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección 10 - Errores comunes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Errores comunes de HTML y CSS</h1>

<h2>1. Etiqueta sin cerrar</h2>
<!-- Revisa que todas las etiquetas estén correctamente cerradas -->
<p>Hola, soy <strong>____________</strong>. Me gusta programar.</p>

<h2>2. Falta el punto y coma</h2>
<p class="aviso">Este texto debería verse rojo y más grande.</p>

<h2>3. Imagen sin texto alternativo</h2>
<!-- Completa el atributo alt con una descripción de la imagen -->
<img src="https://picsum.photos/id/29/150/100" width="150" height="100" alt="________________________">

<h2>4. Clase o ID</h2>
<p class="destacado">Este texto debería tener un fondo amarillo.</p>
</body>

</html>
